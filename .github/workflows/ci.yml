name: MIMI checks
on:
  push:
  pull_request:
jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.7-alpine
        env:
          POSTGRES_USER: mimi
          POSTGRES_PASSWORD: mimi_ci_only
          POSTGRES_DB: mimi_test
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U mimi -d mimi_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://mimi:mimi_ci_only@127.0.0.1:5433/mimi_test
      DATABASE_URL: postgresql://mimi:mimi_ci_only@127.0.0.1:5433/mimi_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm simulate
      - run: pnpm build
      - run: pnpm test:runtime
      - run: pnpm test:accounts-runtime
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
