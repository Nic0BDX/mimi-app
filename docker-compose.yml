services:
  postgres:
    image: postgres:17.7-alpine
    environment:
      POSTGRES_USER: mimi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mimi_dev_only}
      POSTGRES_DB: mimi
    ports: ['127.0.0.1:5432:5432']
    volumes: ['postgres-data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mimi -d mimi']
      interval: 5s
      timeout: 5s
      retries: 10
  postgres-test:
    image: postgres:17.7-alpine
    environment:
      POSTGRES_USER: mimi
      POSTGRES_PASSWORD: mimi_dev_only
      POSTGRES_DB: mimi_test
    ports: ['127.0.0.1:5433:5432']
    tmpfs: ['/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mimi -d mimi_test']
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7.4.7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports: ['127.0.0.1:6379:6379']
    volumes: ['redis-data:/data']
volumes:
  postgres-data:
  redis-data:
